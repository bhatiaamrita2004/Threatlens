spring.application.name=threatlens-backend

# PostgreSQL. Defaults match the local database created with Homebrew.
spring.datasource.url=${THREATLENS_DB_URL:jdbc:postgresql://localhost:5432/threatlens}
spring.datasource.username=${THREATLENS_DB_USER:threatlens}
spring.datasource.password=${THREATLENS_DB_PASSWORD:threatlens}

# Flyway creates and upgrades the tables. Hibernate only checks that they match the entities.
spring.flyway.enabled=true
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.open-in-view=false

# Paging: at most 100 rows per request.
spring.data.web.pageable.max-page-size=100

# JWT. Set THREATLENS_JWT_SECRET in the environment; the default is for local development only.
threatlens.jwt.secret=${THREATLENS_JWT_SECRET:dev-only-secret-change-me-to-a-long-random-value}
threatlens.jwt.expiry-minutes=60

# Demo users (admin / analyst) for local development. Turn off outside development.
threatlens.seed-demo-users=true

springdoc.swagger-ui.path=/swagger-ui.html

# Kafka
threatlens.kafka.enabled=true
threatlens.kafka.events-topic=security-events
threatlens.kafka.alerts-topic=threat-alerts
spring.kafka.bootstrap-servers=localhost:9092
spring.kafka.consumer.group-id=threatlens-backend
spring.kafka.consumer.auto-offset-reset=earliest
spring.kafka.consumer.key-deserializer=org.apache.kafka.common.serialization.StringDeserializer
spring.kafka.consumer.value-deserializer=org.apache.kafka.common.serialization.StringDeserializer
spring.kafka.listener.missing-topics-fatal=false

# Health check: GET /actuator/health is public and shows only UP or DOWN.
management.endpoints.web.exposure.include=health
management.endpoint.health.show-details=never

# Redis (login rate limiting)
threatlens.redis.enabled=true
spring.data.redis.host=${THREATLENS_REDIS_HOST:localhost}
spring.data.redis.port=6379
threatlens.rate-limit.login-max-attempts=5
threatlens.rate-limit.login-window-seconds=60

# OpenSearch (event search)
threatlens.opensearch.enabled=true
threatlens.opensearch.url=${THREATLENS_OPENSEARCH_URL:http://localhost:9200}
threatlens.opensearch.index=threatlens-events